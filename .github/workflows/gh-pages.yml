name: gh-pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    timeout-minutes: 420
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          channel: "nightly-2026-10-18"
          components: "clippy,rust-src,rustfmt"
          targets: "wasm32-unknown-unknown"
          cache: false

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/bin/trunk*
            ~/.cargo/bin/cargo-outdated*
            ~/.cargo/bin/cargo-binstall*
            ~/.cargo/bin/sccache*
            ~/.cargo/bin/.patched-crates
          key: cargo-tools-${{ runner.os }}-trunk-0.21.14-outdated-0.19.0

      - uses: actions/cache@v6.1.0
        with:
          path: target/wgsl-run
          key: wgsl-run-${{ runner.os }}-${{ github.run_id }}
          restore-keys: wgsl-run-${{ runner.os }}-

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.18"
          gleam-version: "1.19.1"
          rebar3-version: "3.24.0"

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "9.0.202"

      - uses: oven-sh/setup-bun@v2.2.0

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.10"

      - id: init
        run: pwsh scripts/init.ps1

      - id: short
        run: pwsh scripts/build.ps1 -Exclude gpu_sim,hunt_sim -Label short

      - id: long-gpu
        if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: pwsh scripts/build.ps1 -Files gpu_sim,hunt_sim -Label long-gpu

      - run: pwsh scripts/publish.ps1
        if: ${{ !cancelled() && contains(matrix.os, 'ubuntu') }}

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: notebooks-${{ matrix.os }}
          path: notebooks
          retention-days: 14

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ci-metrics-${{ matrix.os }}
          path: target/ci-metrics
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && contains(matrix.os, 'ubuntu') }}
        with:
          name: gh-pages
          path: dist
          retention-days: 30

  push:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          name: gh-pages
          path: gh-pages

      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
