<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lua.spi</title>
<style>
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background-color: #1e1e1e; color: #d4d4d4; margin: 0; font: 15px/1.6 system-ui, sans-serif; overflow-wrap: anywhere; }
main { max-width: 960px; margin: 0 auto; padding: 12px; }
pre { background-color: #252526; padding: 10px; border-radius: 4px; overflow-x: auto; font: 13px/1.5 ui-monospace, Consolas, monospace; }
pre.output { background-color: #181818; color: #bbb; border-left: 3px solid #444; }
.plot { background-color: #fff; margin: 6px 0; } .plot svg { max-width: 100%; height: auto; display: block; }
.badge { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 3px; margin-bottom: 4px; }
.badge.passed { background-color: #23452a; color: #9fdc9f; }
.badge.failed { background-color: #4a2323; color: #f0a0a0; }
.badge.other { background-color: #333; color: #bbb; }
a { color: #4fc1ff; }
.tok-comment { color: #6a9955; }
.tok-escaped_char { color: #d7ba7d; }
.tok-escaped_var { color: #d7ba7d; }
.tok-keyword { color: #c586c0; }
.tok-number { color: #b5cea8; }
.tok-number_suffix { color: #b5cea8; }
.tok-operator { color: #d4d4d4; }
.tok-parenthesis { color: #ffd700; }
.tok-string { color: #ce9178; }
.tok-symbol { color: #4fc1ff; }
.tok-type_variable { color: #4ec9b0; }
.tok-unary_operator { color: #d4d4d4; }
.tok-unescaped_char { color: #ce9178; }
.tok-variable { color: #9cdcfe; }
@media (max-width: 600px) { main { padding: 6px; } pre { font-size: 12px; } }
</style>
</head>
<body>
<main>
<pre class="code"><code>///- --package .</code></pre>

<h4>lua (test)</h4>

<span class="badge other">test lua: prelude</span>
<pre class="code"><code>///- --test static --symbol

<span class="tok-keyword">:&lt;</span> <span class="tok-variable">testing</span></code></pre>

<pre class="code"><code><span class="tok-keyword">:&lt;</span> <span class="tok-variable">sm'_operators</span></code></pre>

</main>
</body>
</html>
